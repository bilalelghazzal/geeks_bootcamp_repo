<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="quiz-container" aria-live="polite">
        <h1 style="margin-top:0">Quiz Game</h1>

        <div id="score" class="timer">Score: 0</div>

        <div id="question" class="question">Loading…</div>

        <form id="options" class="options"></form>

        <div id="feedback" class="feedback" role="status"></div>

        <div class="actions">
            <button id="submit" type="button">Submit</button>
            <button id="next" type="button" style="display:none">Next</button>
            <button id="restart" class="restart-btn" type="button">Restart</button>
        </div>

        <div id="final" class="result"></div>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
