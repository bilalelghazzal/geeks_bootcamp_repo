<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertor</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

<div class="converter-container">
    <div class="converter-title">Currency Converter</div>
    <form id="currency-converter" autocomplete="off" onsubmit="">

        <label for="from-currency">From</label>
        <select id="from-currency">
            <option value="EUR">EUR — Euro</option>
            <option value="USD">USD — United States Dollar</option>
            <option value="GBP">GBP — British Pound</option>
            <option value="JPY">JPY — Japanese Yen</option>
        </select>

        <div id="switch-currencies">
            <button type="button" class="switch-btn" title="Swap currencies" onclick="">&#8646;</button>
        </div>

        <label for="to-currency">To</label>
        <select id="to-currency">
            <option value="EUR">EUR — Euro</option>
            <option value="USD">USD — United States Dollar</option>
            <option value="GBP">GBP — British Pound</option>
            <option value="JPY">JPY — Japanese Yen</option>
        </select>

        <label for="amount">Amount</label>
        <input type="number" id="amount" min="0" step="0.01" required placeholder="Enter amount">

        <button type="submit">
            Convert
        </button>

    </form>

    <div id="result" class="result"></div>

</div>
</body>
</html>
